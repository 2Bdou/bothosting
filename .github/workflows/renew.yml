name: Auto Renew Bot-hosting v2

on:
  schedule:
    - cron: '0 8 * * *' # 每天UTC+0 8点
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          # 通知（与 notify.py / dnshe-renewal 对齐；可并存）
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_CONFIG: ${{ secrets.SMTP_CONFIG }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      # 只删超出保留数的旧记录，方便对照定时/手动日志（勿只留 1 条）
      - name: 🧹 清理旧的工作流运行记录
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_RUNS: "10"
        run: |
          keep="${KEEP_RUNS:-10}"
          runs=$(gh run list --workflow="renew.yml" --limit=100 --json databaseId --jq '.[].databaseId' || true)
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ "$count" -gt "$keep" ]; then
              echo "删除旧运行记录: $run_id (保留最近 ${keep} 条)"
              gh run delete "$run_id" || true
            fi
          done
          echo "当前列表共处理 ${count} 条，保留最近 ${keep} 条"
